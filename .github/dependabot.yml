# Обновления зависимостей приезжают обычными PR — то есть проходят те же
# ворота CI, что и наш код. Раз в неделю, чтобы не топить очередь ревью.
version: 2
updates:
  # Веб-половина: pnpm-workspace в корне (экосистема npm покрывает pnpm-lock).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:debt", "domain:infra", "p3"]
    # ОДИН PR на всю неделю вместо восьми. Каждое обновление правит один и тот
    # же pnpm-lock.yaml, а ruleset требует, чтобы ветка была не старше базы:
    # поэтому любой мерж делает все остальные PR устаревшими, Dependabot их
    # ребейзит, следующий мерж роняет снова — карусель, которая 21.08.2026
    # съела полдня на восемь строк версий (#109, разгребали пакетным #118).
    # Группировка убирает причину: конфликтовать внутри одного PR нечему.
    groups:
      npm:
        patterns: ["*"]
    # Мажоры в недельную пачку НЕ входят. Волна 04.09.2026 (#150) приехала
    # красной ровно из-за четырёх мажоров в одном PR с 29 патчами — и вся
    # группа стала немержабельной. Мажор — это отдельный PR с миграцией
    # (#157); миноры и патчи тех же пакетов приезжают штатно.
    #
    # Группа `npm` с `patterns: ["*"]` сама мажоры НЕ фильтрует: всё, что не
    # перечислено в `ignore` ниже, бот кладёт в недельный PR вместе с
    # патчами. Волна 11.09.2026 (#218) так и приехала: vitest 5,
    # coverage-v8 5 и @types/node 26 в одной пачке с 13 минорами — и 20
    # красных голденов Lab (разобрано в #220). Новый мажор в таблице бота —
    # новая строка здесь, а не «разберёмся в PR».
    ignore:
      # TS 7 — нативный компилятор без JS-API; typescript-eslint (зависимость
      # eslint-config-next) без API не загружается, `pnpm lint` падает до
      # первого файла. Сидим на 6.0.3 (последний JS-релиз). Снять, когда
      # закроется строка в docs/registry.md: typescript-eslint поддерживает
      # TS 7 API / TS 7.1 стабилизировал API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mux/mux-node"
        update-types: ["version-update:semver-major"]
      # @types/node: его мажор — это мажор Node, который он описывает, и
      # поднимать его нужно ВМЕСТЕ с .nvmrc (типы = рантайм; все workflow
      # читают версию из .nvmrc) и с проверкой, что Vercel на том же LTS.
      # Раньше он в игноре НЕ стоял нарочно — «PR бота мержится только парой
      # с .nvmrc», — но в сгруппированном PR такой пары не бывает: #218
      # привёз 26 при .nvmrc = 24 внутри пачки патчей. Мажор Node — руками,
      # отдельным PR; миноры/патчи типов приезжают штатно.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Семейство vitest ходит только строем: у @vitest/browser-playwright
      # peer — ТОЧНАЯ версия vitest (поэтому он в package.json запинен без
      # каретки), а @storybook/addon-vitest 10.6 объявляет peer
      # `vitest ^3 || ^4` — на vitest 5 плагин Storybook ещё не работает:
      # в #218 каждый голден Lab вернулся шириной 414 px (дефолтный viewport
      # vitest) вместо 960. Мажор vitest — отдельный PR, когда addon-vitest
      # объявит поддержку (#157, часть 4); маска ловит coverage-v8 и
      # browser-playwright вместе с ядром.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  # Expo-приложение: свой package-lock.json, живёт вне pnpm-воркспейса.
  #
  # ВНИМАНИЕ, ДВЕ ВЕЩИ (обе оплачены 21.08.2026, issue #109):
  #
  # 1. Версии пакетов, которыми управляет Expo SDK, Dependabot двигать НЕ
  #    должен. Их диктует SDK, и меняются они ровно одной командой при
  #    апгрейде SDK — `npx expo install --fix`. Поштучный бамп (Dependabot
  #    предложил react-native 0.86 → 0.87 в обход SDK 57) даёт приложение,
  #    которое не собирается. Отличать просто по диапазону в package.json:
  #    точная версия или `~` — пакет SDK, трогать нельзя; `^` — наш выбор,
  #    обновляется штатно (поэтому react-native-video НЕ в списке ниже и
  #    продолжает получать бампы).
  #
  # 2. Зелёный CI на мобильном PR НИЧЕГО не доказывает про приложение:
  #    джоба `web (lint · types · tests)` исключает `mobile/**` из ESLint,
  #    vitest и tsconfig. Карточка выглядит проверенной, а проверено, что
  #    не сломался веб. Любой оставшийся мобильный бамп мержится только
  #    после ручной сборки приложения.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["type:debt", "domain:mobile", "p3"]
    # Та же группировка, что и у веба (см. комментарий выше).
    groups:
      mobile:
        patterns: ["*"]
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      # Перечислены поимённо, а не маской `react-native-*`: маска заглушила бы
      # и react-native-video — сторонний плеер, который SDK не пинит.
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native-worklets"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type:debt", "domain:infra", "p3"]
    groups:
      actions:
        patterns: ["*"]
