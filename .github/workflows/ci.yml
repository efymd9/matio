# Ворота качества для веб-половины продукта. Красный прогон = PR не вливается
# (имена джоб добавлены в ruleset protect-main как required status checks).
#
# Чего здесь намеренно НЕТ: сборки. `next build` на каждый PR уже делает Vercel
# своим preview-деплоем — второй раз платить теми же минутами не за что.
#
# Мобильное приложение (mobile/) собственной джобы не имеет — его тесты идут в
# той же джобе `web`: проект `mobile` vitest'а (vitest.config.mts) рендерит
# компоненты приложения на react-native-web из mobile/node_modules, поэтому
# ниже стоит `npm ci` в mobile/ (#247). Нативной сборки здесь нет — её делает
# EAS (docs/runbooks/mobile-builds.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Новый пуш в PR отменяет устаревший прогон; на main не отменяем — там каждый
  # коммит должен получить свой честный вердикт.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: web (lint · types · tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # для стики-коммента с покрытием
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover сравнивает с origin/main — нужна история, а не срез.
          fetch-depth: 0

      - name: Подтянуть origin/main для сравнения
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - uses: pnpm/action-setup@v6        # версия берётся из packageManager

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Зависимости мобильного — npm, нарочно вне pnpm-workspace (см.
      # mobile/metro.config.js). Нужны проекту `mobile` vitest'а ниже: его
      # тесты рендерят компоненты приложения на react-native-web из
      # mobile/node_modules (#247). Побочная польза: `npm ci` здесь ловит
      # рассинхрон mobile/package-lock.json ДО облачной сборки — тот самый
      # «Missing … from lock file», который уронил сборку EAS 15.09
      # (docs/runbooks/mobile-builds.md → «Грабли»).
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-mobile-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: npm-mobile-${{ runner.os }}-

      - name: Зависимости мобильного (npm ci)
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Линт
        run: pnpm lint

      - name: Типы
        run: pnpm typecheck

      # Дизайн-система: цветовой литерал в фиче — красный шаг с файлом и
      # строкой. Обоснование и границы проверки — в шапке самого скрипта.
      - name: Токены (запрет цветовых литералов)
        run: ./tools/qa/no-magic-styles.sh

      # Истории UI Lab гоняются в настоящем Chromium, поэтому нужен браузер.
      # Ставим только chromium: остальные движки удвоили бы время без пользы —
      # matio ловит кроссбраузерные различия не голденами, а правилами из
      # docs/gotchas.md (Safari < 15.4 и т.д.).
      # #212: `--with-deps` runs apt-get against every source on the runner,
      # including Google's chrome-stable repo that ubuntu-latest ships with —
      # and that repo has published a Release/Packages.gz mismatch before
      # (2026-09-09, "Hash Sum mismatch", every PR red for hours). We install
      # Playwright's own Chromium, not Google Chrome, so that source is pure
      # liability: drop it before apt runs.
      - name: Убрать apt-репозиторий Google Chrome (#212)
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google.list
      - name: Браузер для UI Lab
        run: pnpm exec playwright install chromium --with-deps

      - name: Тесты с покрытием (unit + mobile + истории Lab)
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee coverage-output.txt

      # Голден упал — отдать человеку то, по чему решение принимается: диффы
      # и свежесгенерированные эталоны. CI на Linux, разработчик обычно на
      # macOS, поэтому эталоны рождаются ЗДЕСЬ: скачал артефакт, посмотрел
      # дифф, и если изменение намеренное — положил PNG в тот же PR.
      - name: Перегенерировать эталоны для скачивания
        if: failure()
        env:
          CI: ""   # иначе vitest отказывается писать отсутствующий эталон
        run: pnpm exec vitest run --project storybook --update || true

      - name: Артефакт голденов (эталоны + диффы)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: |
            **/__screenshots__/**
            .vitest-attachments/**
          retention-days: 14
          if-no-files-found: ignore

      # diff-cover: изменённые в PR строки обязаны быть покрыты ≥85%. Это и
      # есть настоящие ворота — общий процент покрытия растёт медленно, а вот
      # новый непротестированный код в проект больше не попадает.
      - uses: actions/setup-python@v7
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'

      - name: diff-cover (изменённые строки ≥85%)
        if: github.event_name == 'pull_request'
        run: |
          pip install --quiet diff_cover
          set -o pipefail
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch origin/main \
            --fail-under 85 2>&1 | tee diff-cover-output.txt

      - name: Собрать текст комментария
        if: github.event_name == 'pull_request' && always()
        run: |
          {
            echo '### Покрытие'
            echo
            echo '```'
            sed -n '/Coverage summary/,/^=\{10,\}$/p' coverage-output.txt | head -20
            echo '```'
            if [ -f diff-cover-output.txt ]; then
              echo
              echo '### Изменённые строки (diff-cover, порог 85%)'
              echo
              echo '```'
              tail -20 diff-cover-output.txt
              echo '```'
            fi
          } > coverage-comment.md

      # Стики-коммент: один и тот же комментарий ОБНОВЛЯЕТСЯ на каждый пуш,
      # а не плодит ветку из двадцати одинаковых.
      - uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && always()
        with:
          header: coverage
          path: coverage-comment.md

      - name: Артефакт покрытия
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
