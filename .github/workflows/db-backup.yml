# Ежедневный шифрованный дамп боевой базы в Vercel Blob (этап 06 плейбука,
# issue #35). До этого воркфлоу единственной защитой данных был PITR у Neon,
# который никто никогда не проверял восстановлением.
#
# Пара к нему — db-restore-check.yml: дамп, который никто не пробовал
# восстановить, это лотерея. Мёртвый db-backup валит и пробу (там проверка
# свежести), поэтому «бэкапы тихо перестали делаться» не может пролежать месяц.
name: db-backup

on:
  schedule:
    # 03:40 UTC ежедневно. Не 03:17 — там ночной security-скан, делить раннеры
    # с ним незачем.
    - cron: "40 3 * * *"
  # Ручной запуск обязателен (урок #38): воркфлоу, который нельзя запустить
  # руками, чинится только новым пушем. Здесь это ещё и способ снять внеплановый
  # дамп перед рискованной миграцией.
  workflow_dispatch:

permissions: {}

concurrency:
  # Два дампа одновременно не нужны; идущий не отменяем — пусть доедет.
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: дамп → age → Blob
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # эскалация p1-issue при провале планового прогона
    env:
      # Префикс ключей. Разделение по среде заложено сразу: появится дамп
      # стенда — он ляжет в db-backups/staging и не смешается с боевым.
      BACKUP_PREFIX: db-backups/production
      BACKUP_RETENTION_DAYS: "35"
    steps:
      # Гард: печатаем ИМЕНА пустых секретов, а не факт «чего-то не хватает» —
      # молчаливый пропуск без виновника стоил оригиналу четырёх холостых
      # прогонов (образец — release-please.yml).
      #
      # НО: на ПЛАНОВОМ прогоне пустой секрет — это не «фича ещё не настроена»,
      # а регрессия, и мягкий пропуск был бы ровно тем отказом, от которого
      # заводится этот воркфлоу: каждую ночь зелёная галочка и ни одного дампа.
      # Поэтому по расписанию отсутствие секрета валит прогон и заводит p1
      # (критерий приёмки #35: «выключенный секрет → плановый прогон заводит
      # p1-issue»), а ручной запуск и незаполненный репозиторий — пропускаются.
      - name: Проверить секреты
        id: guard
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BACKUP_AGE_PUBLIC_KEY: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          missing=""
          [ -n "$BACKUP_DATABASE_URL" ]   || missing="$missing BACKUP_DATABASE_URL"
          [ -n "$BLOB_READ_WRITE_TOKEN" ] || missing="$missing BLOB_READ_WRITE_TOKEN"
          [ -n "$BACKUP_AGE_PUBLIC_KEY" ] || missing="$missing BACKUP_AGE_PUBLIC_KEY"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "schedule" ]; then
            echo "::error::бэкап настроен, но у планового прогона нет секретов:$missing"
            exit 1
          fi
          echo "::notice::db-backup пропущен — не заданы секреты:$missing"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.ready == 'true'

      # Node нужен не приложению, а обёртке над Vercel Blob
      # (infra/backup/blob.ts под tsx): у Blob нет S3-API, а самодельный curl
      # пришлось бы поддерживать руками.
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Зависимости
        if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # ГРАБЛЯ ПЛЕЙБУКА: Debian-обёртка /usr/bin/pg_dump выбирает СИСТЕМНУЮ
      # версию клиента, а на раннере предустановлен 16-й. Сервер у нас
      # Postgres 18 (Neon), и pg_dump младшего мажора просто отказывается
      # снимать дамп. Поэтому ставим клиента 18 из PGDG и пиннуем РЕАЛЬНЫЕ
      # бинарники в $GITHUB_PATH; версию печатает сам скрипт.
      - name: Клиенты Postgres 18 + age
        if: steps.guard.outputs.ready == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18 age
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Дамп → шифрование → загрузка → ретеншен
        if: steps.guard.outputs.ready == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BACKUP_AGE_PUBLIC_KEY: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
        run: ./infra/backup/backup_db.sh

      # Эскалация. Плановый прогон падает ночью, когда никто не смотрит: без
      # issue отказ увидят в тот день, когда бэкап понадобится. Дубликаты не
      # плодим — вторая ночь подряд становится комментарием в уже открытой.
      - name: Завести p1-issue при провале планового прогона
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          # GH_REPO обязателен: провалиться прогон может НА ГАРДЕ, то есть до
          # checkout — тогда рабочего каталога с гитом нет, и `gh` без явного
          # репозитория падает «not a git repository». Эскалация, которая сама
          # не работает ровно в одном из двух сценариев провала, бесполезна.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "[db-backup] плановый прогон упал"
        run: |
          body=$(printf '%s\n' \
            "Плановый прогон \`db-backup\` упал: $RUN_URL" \
            "" \
            "Пока он красный, свежих копий базы НЕ появляется, а ежемесячная" \
            "проба восстановления (\`db-restore-check\`) начнёт падать по" \
            "возрасту дампа. Диагностика — в логе прогона и в" \
            "docs/runbooks/db-restore.md." \
            "" \
            "_Issue завёл воркфлоу; на доску её нужно положить руками:_" \
            "\`tools/claude/board_status.sh <N> tech\`.")
          num=$(gh issue list --state open --label domain:infra --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title | contains(\"$MARKER\"))][0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
            echo "::warning::дописал комментарий в уже открытую #$num"
          else
            gh issue create --title "$MARKER" \
              --label "type:bug,domain:infra,p1,by:agent-claude" \
              --body "$body"
          fi
